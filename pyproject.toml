[project]
name = "soar-lite"
version = "0.1.0"
description = "First-order n-path descent with stalled-path restarts and a unit-invariant diagonal preconditioner default"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Watson Tree", email = "watson.tree@outlook.com" }]
keywords = [
  "optimization",
  "first-order",
  "gradient-descent",
  "quasi-newton",
  "restart",
  "multi-start",
  "jax",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["jax"]

[project.urls]
Homepage = "https://github.com/watson-tree/soar_lite"
Documentation = "https://watson-tree.github.io/soar_lite"
Repository = "https://github.com/watson-tree/soar_lite"

[build-system]
# uv build resolves the backend from the network in an isolated env; uv.lock
# does not cover it, so cap it here instead.
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff", "pyright", "pytest"]
docs = ["mkdocs", "mkdocstrings[python]"]
exp = ["matplotlib", "optax", "scipy"]

[tool.pytest.ini_options]
# Tests live in tests/; without this a future test_ file in experiments/ or
# docs/ would be collected too.
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "CPY001",               # a copyright header is ceremony; the LICENSE covers it
  "D203", "D213",         # mutually exclusive with D211/D212, and names which yields
  "PLR2004",              # shape and tolerance comparisons; a named constant adds noise
]

[tool.ruff.lint.per-file-ignores]
# print is the experiment scripts' output and the __main__ fallback, not library code
"experiments/**" = ["T201"]
"tests/**" = ["S101", "T201"]
# the docs build hook is not part of the distribution; no package boundary to hang it on
"docs/**" = ["INP001"]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
# unknown-noise from jax's incomplete stubs, kept at information level
reportUnknownVariableType = "information"
reportUnknownParameterType = "information"
reportUnknownArgumentType = "information"
reportUnknownMemberType = "information"
reportUnknownLambdaType = "information"
reportUnknownCallResultType = "information"
reportMissingTypeStubs = "information"