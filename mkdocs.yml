site_name: soar-lite
site_url: https://watson-tree.github.io/soar_lite/
site_description: First-order n-path descent with stalled-path restarts and a unit-invariant diagonal preconditioner default
repo_url: https://github.com/watson-tree/soar_lite
repo_name: watson-tree/soar_lite
docs_dir: docs

# `docs/figures/README.md` is written for the GitHub file view and links out of
# `docs_dir` to `experiments/`; it is not a site page.
exclude_docs: |
  figures/README.md

theme:
  name: readthedocs

nav:
  - Home: index.md
  - Tutorial: tutorial/getting-started.md
  - Surrogate restarts: how-to/surrogate-restarts.md
  - How it works: explanation/how-it-works.md
  - API Reference: reference/api.md

# Marks the blocks mkdocstrings generates, which carry no language of their own.
hooks:
  - docs/hooks.py

markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            # "google" names the section syntax (Args / Returns / Example); the
            # bodies inside those sections are still rendered as Markdown.
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            # Section headings in the page are h2, so an entry that rendered at
            # the default h2 sat beside its own section in the outline instead of
            # under it. Members nest one deeper, at h4.
            heading_level: 3
            show_signature_annotations: true
            # An attribute's declared value is `__init__`'s expression, not a
            # contract: `scale: ndarray = _check_scale(scale, self.d)` puts the
            # normalization on the page as if it were part of the type.
            show_attribute_values: false
            separate_signature: true
            members_order: source
