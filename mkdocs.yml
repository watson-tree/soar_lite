site_name: soar-lite
site_url: https://watson-tree.github.io/soar_lite/
site_description: First-order diagonal-preconditioned n-path descent with sample-based restarts
repo_url: https://github.com/watson-tree/soar_lite
repo_name: watson-tree/soar_lite
docs_dir: docs

theme:
  name: readthedocs

nav:
  - Home: index.md
  - Tutorial: tutorial/getting-started.md
  - API Reference: reference/api.md

# Internal notes live beside the site sources and are not published.
exclude_docs: |
  /PLAN.md
  /adr/

markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
