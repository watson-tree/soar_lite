name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Superseded runs on the same ref are useless here: CI deploys nothing. (docs.yml
# deliberately does the opposite -- a Pages deploy must not be canceled.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Report both interpreters instead of canceling the sibling on first failure.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-groups --frozen
      # Every later step runs --no-sync: the environment is fixed by the sync
      # above, so no implicit re-sync can mutate or prune it.
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync pyright
      # pytest rewrites asserts, so a failure prints the two values; `python -m
      # pytest` also puts the repo root on sys.path, so tests import the source
      # tree rather than an installed copy.
      - run: uv run --no-sync python -m pytest -q