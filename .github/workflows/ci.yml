name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check
      - run: uv run pyright
      # pytest rewrites asserts, so a failure prints the two values; `python -m
      # pytest` also puts the repo root on sys.path, so tests import the source
      # tree rather than an installed copy.
      - run: uv run --no-sync python -m pytest -q