name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          # Pinned so a token change cannot alter rendered annotations.
          python-version: "3.11"
      - run: uv sync --group docs --frozen
      - run: uv run --no-sync mkdocs build --strict
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Pages needs a public repo on the free plan. Gate on a repo variable instead
    # of deleting the job: set PAGES_ENABLED=true once Pages is on, and the deploy
    # resumes with no edit. An unset variable is the empty string, so this is
    # skipped until then while `build` keeps checking the docs on every push.
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
