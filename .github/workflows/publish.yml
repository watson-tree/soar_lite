name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Unprivileged: no OIDC token here, so nothing this job installs or runs --
  # including the build backend, which uv resolves from the network -- can mint
  # a PyPI credential. Tests gate the release before anything is built.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          # The files built here are published; do not let a shared cache
          # influence them.
          enable-cache: false
      - run: uv sync --all-groups --frozen
      # A tag claims which version this is, and PyPI never lets a version number
      # be used twice: the claim is checked before anything is built or
      # uploaded, so a wrong tag costs a failed run and not a spent version.
      - name: The tag names the version being published
        run: |
          version=$(uv run --no-sync python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not name version ${version}" >&2
            exit 1
          fi
      - run: uv run --no-sync python -m pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/

  # Privileged: id-token only, and it runs nothing but the publisher.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/soar-lite
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
